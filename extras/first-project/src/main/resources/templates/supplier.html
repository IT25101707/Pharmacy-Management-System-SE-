
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Suppliers - Pharmacy Management System</title>

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =====================================================
           GLOBAL
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f9fc;
            color: #0f172a;
        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .top-navbar {
            min-height: 74px;

            background: white;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            padding: 0 32px;

            gap: 25px;
        }

        .navbar-title {
            font-size: 24px;

            font-weight: 700;

            color: #0f172a;

            white-space: nowrap;

            margin-right: auto;
        }

        .navbar-title i {
            color: #2563eb;

            margin-right: 8px;
        }

        .navbar-menu {
            display: flex;

            align-items: center;

            gap: 6px;

            flex-wrap: wrap;
        }

        .navbar-menu a {
            text-decoration: none;

            color: #64748b;

            font-size: 14px;

            font-weight: 600;

            padding: 12px 14px;

            border-radius: 11px;

            transition: 0.2s;
        }

        .navbar-menu a:hover {
            background: #f1f5f9;

            color: #2563eb;
        }

        .navbar-menu a.active {
            background: #eff6ff;

            color: #2563eb;
        }

        .navbar-menu i {
            margin-right: 6px;
        }

        .logout-button {
            text-decoration: none;

            background: #2563eb;

            color: white;

            padding: 12px 20px;

            border-radius: 10px;

            font-weight: 700;

            white-space: nowrap;
        }

        .logout-button:hover {
            background: #1d4ed8;
        }

        .logout-button i {
            margin-right: 6px;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .supplier-container {
            max-width: 1260px;

            margin: auto;

            padding: 55px 24px 70px;
        }


        /* =====================================================
           PAGE HEADER
           ===================================================== */

        .page-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 55px;
        }

        .page-header h1 {
            font-size: 38px;

            font-weight: 700;

            color: #0f172a;

            margin-bottom: 10px;
        }

        .page-header p {
            color: #64748b;

            font-size: 18px;
        }


        /* =====================================================
           ADD BUTTON
           ===================================================== */

        .add-button {
            border: none;

            background: #2563eb;

            color: white;

            padding: 14px 22px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .add-button i {
            margin-right: 7px;
        }


        /* =====================================================
           CARD
           ===================================================== */

        .supplier-card {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                    0 8px 25px rgba(15, 23, 42, 0.06);

            overflow: hidden;
        }

        .card-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 22px;

            color: #163f7a;
        }

        .supplier-count {
            background: #eff6ff;

            color: #2563eb;

            padding: 9px 16px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 700;
        }


        /* =====================================================
           TABLE
           ===================================================== */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: separate;

            border-spacing: 0;

            min-width: 850px;
        }

        thead th {
            background: #2563eb;

            color: white;

            padding: 16px;

            text-align: left;

            font-size: 14px;
        }

        thead th:first-child {
            border-radius: 10px 0 0 10px;
        }

        thead th:last-child {
            border-radius: 0 10px 10px 0;
        }

        tbody td {
            padding: 18px 16px;

            border-bottom: 1px solid #e5e7eb;

            color: #334155;

            font-size: 15px;
        }

        tbody tr:hover {
            background: #f8fafc;
        }


        /* =====================================================
           NAME
           ===================================================== */

        .supplier-name-cell {
            display: flex;

            align-items: center;

            gap: 12px;

            font-weight: 700;

            color: #163f7a;
        }

        .supplier-icon {
            width: 40px;

            height: 40px;

            border-radius: 11px;

            background: #eff6ff;

            color: #2563eb;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =====================================================
           CONTACT
           ===================================================== */

        .contact-cell i,
        .email-cell i,
        .address-cell i {
            color: #64748b;

            margin-right: 7px;
        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        .action-buttons {
            display: flex;

            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;

            padding: 9px 13px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;
        }

        .edit-btn {
            background: #fff7ed;

            color: #ea580c;
        }

        .delete-btn {
            background: #fef2f2;

            color: #dc2626;
        }

        .view-only {
            background: #eff6ff;

            color: #2563eb;

            padding: 8px 12px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message {
            text-align: center;

            padding: 35px 20px;

            color: #64748b;
        }


        /* =====================================================
           MODAL
           ===================================================== */

        .modal-overlay {
            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, 0.48);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;

            max-width: 660px;

            background: white;

            border-radius: 18px;

            padding: 34px;

            box-shadow:
                    0 25px 70px rgba(15, 23, 42, 0.22);
        }

        .modal-header {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            margin-bottom: 28px;
        }

        .modal-title h2 {
            color: #163f7a;

            font-size: 27px;

            margin-bottom: 7px;
        }

        .modal-title p {
            color: #64748b;

            font-size: 14px;
        }

        .close-modal {
            width: 38px;

            height: 38px;

            border: none;

            background: #f1f5f9;

            color: #64748b;

            border-radius: 10px;

            cursor: pointer;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 14px;

            font-weight: 700;

            color: #334155;

            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #64748b;
        }

        .form-group input {
            width: 100%;

            height: 50px;

            border: 1px solid #d7dee8;

            border-radius: 10px;

            padding: 0 15px 0 43px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                    0 0 0 3px
                    rgba(37, 99, 235, 0.12);
        }


        /* =====================================================
           MODAL FOOTER
           ===================================================== */

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 30px;

            padding-top: 22px;

            border-top: 1px solid #e5e7eb;
        }

        .cancel-button {
            border: none;

            background: #f1f5f9;

            color: #475569;

            padding: 12px 20px;

            border-radius: 10px;

            font-weight: 700;

            cursor: pointer;
        }

        .save-button {
            border: none;

            background: #2563eb;

            color: white;

            padding: 12px 21px;

            border-radius: 10px;

            font-weight: 700;

            cursor: pointer;
        }


        /* =====================================================
           TOAST
           ===================================================== */

        .toast {
            position: fixed;

            right: 25px;

            bottom: 25px;

            background: #16a34a;

            color: white;

            padding: 14px 20px;

            border-radius: 10px;

            font-weight: 700;

            display: none;

            z-index: 2000;
        }

        .toast.show {
            display: block;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 900px) {

            .top-navbar {
                padding: 16px;

                flex-wrap: wrap;
            }

            .navbar-title {
                width: 100%;

                text-align: center;

                margin-right: 0;
            }

            .navbar-menu {
                width: 100%;

                justify-content: center;
            }

            .logout-button {
                margin: auto;
            }

        }


        @media (max-width: 700px) {

            .page-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 20px;
            }

            .add-button {
                width: 100%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .modal {
                padding: 25px;
            }

        }


    </style>

</head>


<body>


<!-- =====================================================
     COMMON NAVBAR
     ===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<main class="supplier-container">


    <section class="page-header">

        <div>

            <h1>
                Suppliers
            </h1>

            <p>
                Manage your pharmacy suppliers.
            </p>

        </div>


        <button
                id="addSupplierButton"
                class="add-button"
                onclick="openAddModal()">

            <i class="fa-solid fa-plus"></i>

            Add Supplier

        </button>

    </section>



    <!-- =================================================
         SUPPLIER LIST
         ================================================= -->

    <section class="supplier-card">


        <div class="card-header">

            <h2>
                Supplier List
            </h2>

            <span
                    id="supplierCount"
                    class="supplier-count">

                0 Suppliers

            </span>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Contact</th>

                    <th>Email</th>

                    <th>Address</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="supplierTableBody">

                </tbody>

            </table>


            <div
                    id="message"
                    class="message">

                Loading suppliers...

            </div>

        </div>

    </section>

</main>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
        id="supplierModal"
        class="modal-overlay">


    <div class="modal">


        <div class="modal-header">

            <div class="modal-title">

                <h2 id="modalTitle">
                    Add Supplier
                </h2>

                <p>
                    Enter supplier details below.
                </p>

            </div>


            <button
                    type="button"
                    class="close-modal"
                    onclick="closeModal()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>


        <form id="supplierForm">


            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group full-width">

                    <label for="name">
                        Supplier Name
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-building"></i>

                        <input
                                type="text"
                                id="name"
                                placeholder="Enter supplier name"
                                required>

                    </div>

                </div>


                <!-- CONTACT -->

                <div class="form-group">

                    <label for="contact">
                        Contact
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-phone"></i>

                        <input
                                type="text"
                                id="contact"
                                placeholder="0771234567"
                                pattern="^(\+94|0)7[0-9]{8}$"
                                required>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                                type="email"
                                id="email"
                                placeholder="supplier@gmail.com"
                                required>

                    </div>

                </div>


                <!-- ADDRESS -->

                <div class="form-group full-width">

                    <label for="address">
                        Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-location-dot"></i>

                        <input
                                type="text"
                                id="address"
                                placeholder="Enter supplier address"
                                required>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                        type="button"
                        class="cancel-button"
                        onclick="closeModal()">

                    Cancel

                </button>


                <button
                        type="submit"
                        class="save-button"
                        id="saveButton">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Supplier

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =====================================================
     TOAST
     ===================================================== -->

<div
        id="toast"
        class="toast">

    Supplier saved successfully.

</div>


<script>

    /* =====================================================
       ROLE
       ===================================================== */

    const currentRole =
        '[[${session.role}]]';


    const canManageSuppliers =
        currentRole === 'ADMIN' ||
        currentRole === 'INVENTORY_OFFICER' ||
        currentRole === 'SUPPLIER';


    let editingId = null;


    /* =====================================================
       ROLE UI
       ===================================================== */

    function applyRolePermissions() {

        const addButton =
            document.getElementById(
                "addSupplierButton"
            );


        if (!canManageSuppliers) {

            addButton.style.display =
                "none";

        }

    }


    /* =====================================================
       LOAD SUPPLIERS
       ===================================================== */

    async function loadSuppliers() {

        const tableBody =
            document.getElementById(
                "supplierTableBody"
            );

        const message =
            document.getElementById(
                "message"
            );

        const count =
            document.getElementById(
                "supplierCount"
            );


        try {

            const response =
                await fetch(
                    "/api/suppliers"
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load suppliers."
                );

            }


            const suppliers =
                await response.json();


            tableBody.innerHTML = "";


            count.textContent =
                suppliers.length +
                (
                    suppliers.length === 1
                        ? " Supplier"
                        : " Suppliers"
                );


            if (
                suppliers.length === 0
            ) {

                message.style.display =
                    "block";

                message.textContent =
                    "No suppliers available.";

                return;

            }


            message.style.display =
                "none";


            suppliers.forEach(
                supplier => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    let actions = "";


                    if (
                        canManageSuppliers
                    ) {

                        actions = `

                            <div class="action-buttons">

                                <button
                                    class="edit-btn"
                                    onclick="editSupplier(${supplier.id})">

                                    <i class="fa-solid fa-pen"></i>

                                    Edit

                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteSupplier(${supplier.id})">

                                    <i class="fa-solid fa-trash"></i>

                                    Delete

                                </button>

                            </div>

                        `;

                    } else {

                        actions = `

                            <span class="view-only">

                                <i class="fa-solid fa-eye"></i>

                                View Only

                            </span>

                        `;

                    }


                    row.innerHTML = `

                        <td>
                            ${supplier.id}
                        </td>

                        <td>

                            <div class="supplier-name-cell">

                                <div class="supplier-icon">

                                    <i class="fa-solid fa-building"></i>

                                </div>

                                <span>
                                    ${escapeHtml(
                        supplier.name
                    )}
                                </span>

                            </div>

                        </td>

                        <td class="contact-cell">

                            <i class="fa-solid fa-phone"></i>

                            ${escapeHtml(
                        supplier.contact
                    )}

                        </td>

                        <td class="email-cell">

                            <i class="fa-solid fa-envelope"></i>

                            ${escapeHtml(
                        supplier.email
                    )}

                        </td>

                        <td class="address-cell">

                            <i class="fa-solid fa-location-dot"></i>

                            ${escapeHtml(
                        supplier.address
                    )}

                        </td>

                        <td>
                            ${actions}
                        </td>

                    `;


                    tableBody.appendChild(
                        row
                    );

                }
            );

        }


        catch (error) {

            console.error(
                error
            );


            message.style.display =
                "block";

            message.textContent =
                "Unable to load suppliers.";

        }

    }


    /* =====================================================
       ADD
       ===================================================== */

    function openAddModal() {

        if (!canManageSuppliers) {

            alert(
                "You do not have permission."
            );

            return;

        }


        editingId = null;


        document.getElementById(
            "supplierForm"
        ).reset();


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Add Supplier";


        document.getElementById(
            "saveButton"
        ).innerHTML = `

            <i class="fa-solid fa-floppy-disk"></i>

            Save Supplier

        `;


        document.getElementById(
            "supplierModal"
        ).classList.add(
            "show"
        );

    }


    /* =====================================================
       CLOSE
       ===================================================== */

    function closeModal() {

        document.getElementById(
            "supplierModal"
        ).classList.remove(
            "show"
        );


        editingId = null;

        document.getElementById(
            "supplierForm"
        ).reset();

    }


    /* =====================================================
       CREATE / UPDATE
       ===================================================== */

    document.getElementById(
        "supplierForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!canManageSuppliers) {

                return;

            }


            const supplier = {

                name:
                    document.getElementById(
                        "name"
                    ).value.trim(),

                contact:
                    document.getElementById(
                        "contact"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "email"
                    ).value.trim(),

                address:
                    document.getElementById(
                        "address"
                    ).value.trim()

            };


            const phonePattern =
                /^(\+94|0)7[0-9]{8}$/;


            if (
                !phonePattern.test(
                    supplier.contact
                )
            ) {

                alert(
                    "Enter a valid Sri Lankan phone number."
                );

                return;

            }


            try {

                let response;


                if (
                    editingId !== null
                ) {

                    response =
                        await fetch(
                            `/api/suppliers/${editingId}`,
                            {

                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        supplier
                                    )

                            }
                        );

                } else {

                    response =
                        await fetch(
                            "/api/suppliers",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        supplier
                                    )

                            }
                        );

                }


                if (!response.ok) {

                    let message =
                        "Operation failed.";

                    try {

                        const error =
                            await response.json();

                        if (
                            error.message
                        ) {

                            message =
                                error.message;

                        }

                    } catch (e) {

                        console.error(e);

                    }


                    throw new Error(
                        message
                    );

                }


                showToast(
                    editingId !== null
                        ? "Supplier updated successfully."
                        : "Supplier added successfully."
                );


                closeModal();


                loadSuppliers();

                loadStockAlerts();

                setInterval(loadStockAlerts, 30000);

            }


            catch (error) {

                console.error(
                    error
                );

                alert(
                    error.message ||
                    "Unable to save supplier."
                );

            }

        }
    );


    /* =====================================================
       EDIT
       ===================================================== */

    async function editSupplier(id) {

        if (!canManageSuppliers) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/suppliers/${id}`
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load supplier."
                );

            }


            const supplier =
                await response.json();


            document.getElementById(
                "name"
            ).value =
                supplier.name || "";


            document.getElementById(
                "contact"
            ).value =
                supplier.contact || "";


            document.getElementById(
                "email"
            ).value =
                supplier.email || "";


            document.getElementById(
                "address"
            ).value =
                supplier.address || "";


            editingId = id;


            document.getElementById(
                "modalTitle"
            ).textContent =
                "Edit Supplier";


            document.getElementById(
                "saveButton"
            ).innerHTML = `

                <i class="fa-solid fa-floppy-disk"></i>

                Update Supplier

            `;


            document.getElementById(
                "supplierModal"
            ).classList.add(
                "show"
            );

        }


        catch (error) {

            console.error(
                error
            );

            alert(
                error.message
            );

        }

    }


    /* =====================================================
       DELETE
       ===================================================== */

    async function deleteSupplier(id) {

        if (!canManageSuppliers) {

            return;

        }


        if (
            !confirm(
                "Are you sure you want to delete this supplier?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/suppliers/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to delete supplier."
                );

            }


            showToast(
                "Supplier deleted successfully."
            );


            loadSuppliers();

        }


        catch (error) {

            console.error(
                error
            );

            alert(
                error.message
            );

        }

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =====================================================
       TOAST
       ===================================================== */

    function showToast(message) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

    }


    /* =====================================================
       OUTSIDE CLICK
       ===================================================== */

    document.getElementById(
        "supplierModal"
    ).addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );


    /* =====================================================
       ESC
       ===================================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeModal();

            }

        }
    );



    /* =====================================================
       START
       ===================================================== */

    applyRolePermissions();

    loadSuppliers();

</script>


</body>

</html>
