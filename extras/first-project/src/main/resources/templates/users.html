<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users & Stakeholders - Pharmacy Management System</title>

    <link rel="stylesheet"
          href="/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        .page-container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 30px;
        }


        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }


        .page-header h1 {
            margin: 0;
            color: #0f172a;
        }


        .page-header p {
            margin-top: 8px;
            color: #64748b;
        }


        .primary-button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 19px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: 0.2s;
        }


        .primary-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }


        .secondary-button {
            border: none;
            background: #e5e7eb;
            color: #111827;
            padding: 12px 19px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
        }


        .secondary-button:hover {
            background: #d1d5db;
        }


        .form-card {
            background: white;
            padding: 27px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.07);
            border: 1px solid #e5e7eb;
        }


        .form-card h2 {
            margin-top: 0;
            color: #173b73;
            margin-bottom: 22px;
        }


        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
        }


        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            color: #334155;

            background: white;

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #2563eb;

            box-shadow:
                    0 0 0 3px
                    rgba(37, 99, 235, 0.10);
        }


        .form-group small {

            margin-top: 6px;

            color: #64748b;

            font-size: 13px;
        }


        .form-actions {

            margin-top: 24px;

            display: flex;

            gap: 10px;
        }


        .table-card {

            background: white;

            padding: 27px;

            border-radius: 14px;

            box-shadow:
                    0 5px 18px
                    rgba(15, 23, 42, 0.07);

            border: 1px solid #e5e7eb;

            overflow-x: auto;
        }


        .table-card h2 {

            color: #173b73;

            margin: 0;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }


        th,
        td {

            padding: 14px;

            border-bottom:
                    1px solid #e5e7eb;

            text-align: left;

            font-size: 14px;
        }


        th {

            background: #2563eb;

            color: white;

            font-weight: 700;
        }


        th:first-child {

            border-radius:
                    9px 0 0 9px;
        }


        th:last-child {

            border-radius:
                    0 9px 9px 0;
        }


        td {

            color: #334155;
        }


        tbody tr:hover {

            background: #f8fafc;
        }


        .action-button {

            border: none;

            padding: 8px 12px;

            border-radius: 7px;

            cursor: pointer;

            margin-right: 5px;

            font-weight: 600;
        }


        .edit-button {

            background: #fff7ed;

            color: #ea580c;
        }


        .edit-button:hover {

            background: #ffedd5;
        }


        .delete-button {

            background: #fef2f2;

            color: #dc2626;
        }


        .delete-button:hover {

            background: #fee2e2;
        }


        .hidden {

            display: none;
        }


        .message {

            display: none;

            padding: 13px 15px;

            margin-bottom: 20px;

            border-radius: 9px;

            font-weight: 600;

            line-height: 1.5;
        }


        .success {

            display: block;

            background: #dcfce7;

            color: #166534;

            border: 1px solid #bbf7d0;
        }


        .error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

            border: 1px solid #fecaca;
        }


        .loading-row {

            text-align: center;

            padding: 30px;

            color: #64748b;
        }


        .role-badge {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 15px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 12px;

            font-weight: 700;
        }


        @media (max-width: 800px) {

            .form-grid {

                grid-template-columns: 1fr;
            }


            .page-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }


            .page-container {

                padding: 20px;
            }


            .form-actions {

                flex-direction: column;
            }


            .form-actions button {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<!-- =====================================================
     COMMON NAVBAR
     ===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>




<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="page-container">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Users &amp; Stakeholders
            </h1>

            <p>
                Manage system users and stakeholders.
            </p>

        </div>


        <button class="primary-button"
                onclick="showAddForm()">

            <i class="fa-solid fa-plus"></i>

            Add Stakeholder

        </button>

    </div>



    <!-- MESSAGE -->

    <div id="message"
         class="message">
    </div>



    <!-- =================================================
         ADD / EDIT FORM
         ================================================= -->

    <div id="formCard"
         class="form-card hidden">


        <h2 id="formTitle">

            Add Stakeholder

        </h2>


        <form id="userForm">


            <input type="hidden"
                   id="userId">


            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                            type="text"
                            id="name"
                            required>

                </div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                            type="text"
                            id="username"
                            required>

                    <small>
                        Username must be unique.
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password">

                    <small>
                        Required when adding a new stakeholder.
                    </small>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                            type="tel"
                            id="phone"
                            placeholder="0712345678"
                            pattern="^(\+94|0)7[0-9]{8}$"
                            required>

                    <small>
                        Example: 0712345678
                    </small>

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Role
                    </label>

                    <select
                            id="role"
                            required>

                        <option value="">
                            Select Role
                        </option>

                        <option value="ADMIN">
                            ADMIN
                        </option>

                        <option value="PHARMACIST">
                            PHARMACIST
                        </option>

                        <option value="INVENTORY_OFFICER">
                            INVENTORY OFFICER
                        </option>

                        <option value="FINANCE_OFFICER">
                            FINANCE OFFICER
                        </option>

                        <option value="SALES_OFFICER">
                            SALES OFFICER
                        </option>

                        <option value="SUPPLIER">
                            SUPPLIER
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-actions">


                <button
                        type="submit"
                        class="primary-button">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Stakeholder

                </button>


                <button
                        type="button"
                        class="secondary-button"
                        onclick="hideForm()">

                    Cancel

                </button>


            </div>


        </form>

    </div>



    <!-- =================================================
         USERS TABLE
         ================================================= -->

    <div class="table-card">


        <h2>
            System Users
        </h2>


        <br>


        <table>


            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Username</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Role</th>

                <th>Actions</th>

            </tr>

            </thead>


            <tbody id="usersTableBody">

            <tr>

                <td colspan="7"
                    class="loading-row">

                    Loading users...

                </td>

            </tr>

            </tbody>


        </table>


    </div>


</main>



<script>

    const formCard =
        document.getElementById("formCard");

    const userForm =
        document.getElementById("userForm");

    const messageBox =
        document.getElementById("message");


    // =====================================================
    // SHOW ADD FORM
    // =====================================================

    function showAddForm() {

        formCard.classList.remove("hidden");

        document.getElementById(
            "formTitle"
        ).textContent =
            "Add Stakeholder";


        userForm.reset();


        document.getElementById(
            "userId"
        ).value = "";


        document.getElementById(
            "password"
        ).required = true;


        clearMessage();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    // =====================================================
    // HIDE FORM
    // =====================================================

    function hideForm() {

        formCard.classList.add("hidden");

        userForm.reset();


        document.getElementById(
            "userId"
        ).value = "";


        document.getElementById(
            "password"
        ).required = false;


        clearMessage();
    }


    // =====================================================
    // SHOW MESSAGE
    // =====================================================

    function showMessage(
        message,
        type
    ) {

        messageBox.textContent =
            message;

        messageBox.className =
            "message " + type;


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


        setTimeout(() => {

            clearMessage();

        }, 5000);
    }


    // =====================================================
    // CLEAR MESSAGE
    // =====================================================

    function clearMessage() {

        messageBox.textContent = "";

        messageBox.className =
            "message";
    }


    // =====================================================
    // GET ERROR MESSAGE
    // =====================================================

    async function getErrorMessage(response) {

        try {

            const data =
                await response.json();

            if (data.error) {

                return data.error;
            }

            if (data.message) {

                return data.message;
            }

        } catch (error) {

            // Response was not JSON
        }


        const text =
            await response.text();

        return text ||
            "Unable to complete the operation.";
    }


    // =====================================================
    // LOAD USERS
    // =====================================================

    async function loadUsers() {

        const tableBody =
            document.getElementById(
                "usersTableBody"
            );


        try {

            const response =
                await fetch(
                    "/api/users"
                );


            if (!response.ok) {

                throw new Error(
                    await getErrorMessage(response)
                );
            }


            const users =
                await response.json();


            tableBody.innerHTML =
                "";


            if (users.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td colspan="7"
                            class="loading-row">

                            No system users found.

                        </td>

                    </tr>

                `;

                return;
            }


            users.forEach(user => {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${escapeHtml(user.id)}
                    </td>

                    <td>
                        ${escapeHtml(user.name)}
                    </td>

                    <td>
                        ${escapeHtml(user.username)}
                    </td>

                    <td>
                        ${escapeHtml(user.email)}
                    </td>

                    <td>
                        ${escapeHtml(user.phone)}
                    </td>

                    <td>

                        <span class="role-badge">

                            ${escapeHtml(user.role)}

                        </span>

                    </td>

                    <td>

                        <button
                            class="action-button edit-button"
                            onclick="editUser(${user.id})">

                            <i class="fa-solid fa-pen"></i>

                            Edit

                        </button>


                        <button
                            class="action-button delete-button"
                            onclick="deleteUser(${user.id})">

                            <i class="fa-solid fa-trash"></i>

                            Delete

                        </button>

                    </td>

                `;


                tableBody.appendChild(row);

            });


        } catch (error) {

            tableBody.innerHTML = `

                <tr>

                    <td colspan="7"
                        class="loading-row">

                        Unable to load users.

                    </td>

                </tr>

            `;


            showMessage(
                error.message,
                "error"
            );
        }
    }


    // =====================================================
    // EDIT USER
    // =====================================================

    async function editUser(id) {

        try {

            const response =
                await fetch(
                    `/api/users/${id}`
                );


            if (!response.ok) {

                throw new Error(
                    await getErrorMessage(response)
                );
            }


            const user =
                await response.json();


            formCard.classList.remove(
                "hidden"
            );


            document.getElementById(
                "formTitle"
            ).textContent =
                "Edit Stakeholder";


            document.getElementById(
                "userId"
            ).value =
                user.id;


            document.getElementById(
                "name"
            ).value =
                user.name || "";


            document.getElementById(
                "username"
            ).value =
                user.username || "";


            document.getElementById(
                "email"
            ).value =
                user.email || "";


            document.getElementById(
                "phone"
            ).value =
                user.phone || "";


            document.getElementById(
                "role"
            ).value =
                user.role || "";


            document.getElementById(
                "password"
            ).value =
                "";


            document.getElementById(
                "password"
            ).required =
                false;


            clearMessage();


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            showMessage(
                error.message,
                "error"
            );
        }
    }


    // =====================================================
    // SAVE USER
    // CREATE / UPDATE
    // =====================================================

    userForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const id =
                document.getElementById(
                    "userId"
                ).value;


            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const role =
                document.getElementById(
                    "role"
                ).value;


            // CLIENT VALIDATION

            if (!name) {

                showMessage(
                    "Name is required.",
                    "error"
                );

                return;
            }


            if (!username) {

                showMessage(
                    "Username is required.",
                    "error"
                );

                return;
            }


            if (!id && !password) {

                showMessage(
                    "Password is required when adding a new stakeholder.",
                    "error"
                );

                return;
            }


            if (!email) {

                showMessage(
                    "Email is required.",
                    "error"
                );

                return;
            }


            if (!phone) {

                showMessage(
                    "Phone number is required.",
                    "error"
                );

                return;
            }


            if (!/^(\+94|0)7[0-9]{8}$/.test(phone)) {

                showMessage(
                    "Enter a valid Sri Lankan phone number.",
                    "error"
                );

                return;
            }


            if (!role) {

                showMessage(
                    "Please select a role.",
                    "error"
                );

                return;
            }


            const user = {

                name: name,

                username: username,

                password: password,

                email: email,

                phone: phone,

                role: role

            };


            try {

                let response;


                // =================================================
                // UPDATE
                // =================================================

                if (id) {

                    response =
                        await fetch(
                            `/api/users/${id}`,
                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        user
                                    )
                            }
                        );

                }


                    // =================================================
                    // CREATE
                // =================================================

                else {

                    response =
                        await fetch(
                            "/api/users",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        user
                                    )
                            }
                        );
                }


                // =================================================
                // ERROR
                // =================================================

                if (!response.ok) {

                    const errorMessage =
                        await getErrorMessage(
                            response
                        );


                    throw new Error(
                        errorMessage
                    );
                }


                // =================================================
                // SUCCESS
                // =================================================

                showMessage(

                    id
                        ? "Stakeholder updated successfully."
                        : "Stakeholder added successfully.",

                    "success"
                );


                hideForm();


                await loadUsers();


            } catch (error) {

                console.error(error);


                showMessage(
                    error.message,
                    "error"
                );
            }

        }
    );


    // =====================================================
    // DELETE USER
    // =====================================================

    async function deleteUser(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this stakeholder?"
            );


        if (!confirmed) {

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/users/${id}`,
                    {

                        method: "DELETE"

                    }
                );


            if (!response.ok) {

                throw new Error(
                    await getErrorMessage(response)
                );
            }


            showMessage(
                "Stakeholder deleted successfully.",
                "success"
            );


            await loadUsers();


        } catch (error) {

            console.error(error);


            showMessage(
                error.message,
                "error"
            );
        }
    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";
        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );
    }


    // =====================================================
    // INITIAL LOAD
    // =====================================================

    loadUsers();

</script>


</body>

</html>
