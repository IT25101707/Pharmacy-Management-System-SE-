
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prescriptions - Pharmacy Management System</title>

    <link rel="stylesheet" href="/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        .page-container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 55px 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 55px;
        }

        .page-header h1 {
            font-size: 40px;
            color: #0f172a;
            margin: 0 0 10px;
        }

        .page-header p {
            color: #64748b;
            font-size: 18px;
            margin: 0;
        }


        /* =====================================================
           ADD BUTTON
           ===================================================== */

        .primary-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(37, 99, 235, 0.20);
            transition: 0.2s;
        }

        .primary-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }


        /* =====================================================
           CARD
           ===================================================== */

        .content-card {
            background: white;
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
            border: 1px solid #e5e7eb;
        }

        .card-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .card-heading h2 {
            margin: 0;
            font-size: 23px;
            color: #173b73;
        }

        .count-badge {
            background: #eff6ff;
            color: #2563eb;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }


        /* =====================================================
           TABLE
           ===================================================== */

        .table-wrapper {
            overflow-x: auto;
        }

        .prescription-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .prescription-table thead tr {
            background: #2563eb;
        }

        .prescription-table th {
            color: white;
            text-align: left;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
        }

        .prescription-table th:first-child {
            border-radius: 10px 0 0 10px;
        }

        .prescription-table th:last-child {
            border-radius: 0 10px 10px 0;
        }

        .prescription-table td {
            padding: 17px 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #334155;
            font-size: 15px;
        }

        .prescription-table tbody tr:hover {
            background: #f8fafc;
        }

        .id-text {
            color: #64748b;
            font-weight: 500;
        }

        .medicine-name {
            color: #173b73;
            font-weight: 600;
        }

        .dosage-badge {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 13px;
        }

        .date-badge {
            color: #475569;
            font-weight: 500;
        }


        /* =====================================================
           ACTION BUTTONS
           ===================================================== */

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .edit-btn {
            background: #fff7ed;
            color: #ea580c;
        }

        .edit-btn:hover {
            background: #ffedd5;
        }

        .delete-btn {
            background: #fef2f2;
            color: #dc2626;
        }

        .delete-btn:hover {
            background: #fee2e2;
        }

        .edit-btn i,
        .delete-btn i {
            margin-right: 5px;
        }


        /* =====================================================
           VIEW ONLY
           ===================================================== */

        .view-only {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            background: #eff6ff;
            color: #2563eb;

            padding: 8px 12px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
        }


        /* =====================================================
           EMPTY
           ===================================================== */

        .empty-row {
            text-align: center;
            padding: 45px !important;
            color: #94a3b8 !important;
        }


        /* =====================================================
           MODAL
           ===================================================== */

        .modal-overlay {
            position: fixed;
            inset: 0;

            background: rgba(15, 23, 42, 0.48);

            display: none;

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 9999;

            backdrop-filter: blur(3px);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;

            background: white;

            border-radius: 20px;

            padding: 32px;

            box-shadow:
                    0 25px 60px rgba(15, 23, 42, 0.25);

            animation: modalShow 0.2s ease;
        }

        @keyframes modalShow {

            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =====================================================
           MODAL HEADER
           ===================================================== */

        .modal-header {
            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0 0 7px;

            color: #173b73;

            font-size: 28px;
        }

        .modal-header p {
            margin: 0;

            color: #64748b;

            font-size: 14px;
        }

        .close-btn {
            border: none;

            width: 40px;
            height: 40px;

            border-radius: 10px;

            background: #f1f5f9;

            color: #64748b;

            cursor: pointer;

            font-size: 18px;
        }

        .close-btn:hover {
            background: #e2e8f0;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-weight: 600;

            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b;
        }

        .input-wrapper input {
            width: 100%;

            height: 50px;

            border: 1px solid #d7dee8;

            border-radius: 10px;

            padding: 0 15px 0 44px;

            font-size: 15px;

            outline: none;

            color: #334155;

            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #2563eb;

            box-shadow:
                    0 0 0 3px
                    rgba(37, 99, 235, 0.10);
        }

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }


        /* =====================================================
           MODAL FOOTER
           ===================================================== */

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 28px;

            padding-top: 20px;

            border-top: 1px solid #e5e7eb;
        }

        .cancel-btn {
            border: none;

            background: #f1f5f9;

            color: #475569;

            padding: 12px 20px;

            border-radius: 9px;

            font-weight: 600;

            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #e2e8f0;
        }

        .save-btn {
            border: none;

            background: #2563eb;

            color: white;

            padding: 12px 20px;

            border-radius: 9px;

            font-weight: 600;

            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message {
            display: none;

            margin-top: 15px;

            padding: 11px 14px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;
        }

        .message.success {
            display: block;

            background: #ecfdf5;

            color: #047857;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            color: #dc2626;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {

            .page-container {
                padding: 35px 18px;
            }

            .page-header {
                flex-direction: column;

                gap: 20px;

                margin-bottom: 35px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 24px;
            }

            .action-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     COMMON NAVBAR
     ===================================================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- =====================================================
     MAIN CONTENT CONTENT
     ===================================================== -->

<main class="page-container">


    <!-- PAGE HEADER -->

    <section class="page-header">


        <div>

            <h1>
                Prescriptions
            </h1>

            <p>
                Manage your pharmacy prescriptions.
            </p>

        </div>


        <!-- ADMIN + PHARMACIST -->

        <button class="primary-btn"
                onclick="openAddModal()"
                th:if="${session.role == 'ADMIN'
                         or session.role == 'PHARMACIST'}">

            <i class="fa-solid fa-plus"></i>

            Add Prescription

        </button>


    </section>


    <!-- MESSAGE -->

    <div id="message"
         class="message">
    </div>


    <!-- =================================================
         PRESCRIPTION LIST
         ================================================= -->

    <section class="content-card">


        <div class="card-heading">


            <h2>

                <i class="fa-solid fa-file-prescription"></i>

                Prescription List

            </h2>


            <span class="count-badge"
                  id="prescriptionCount">

                0 Prescriptions

            </span>


        </div>


        <div class="table-wrapper">


            <table class="prescription-table">


                <thead>

                <tr>

                    <th>ID</th>

                    <th>Medicine</th>

                    <th>Dosage</th>

                    <th>Date</th>

                    <th>Actions</th>

                </tr>

                </thead>


                <tbody id="prescriptionTableBody">

                </tbody>


            </table>


        </div>


    </section>


</main>


<!-- =====================================================
     ADD / EDIT MODAL
     ===================================================== -->

<div id="prescriptionModal"
     class="modal-overlay">


    <div class="modal">


        <div class="modal-header">


            <div>

                <h2 id="modalTitle">
                    Add Prescription
                </h2>

                <p>
                    Enter prescription details below.
                </p>

            </div>


            <button class="close-btn"
                    onclick="closeModal()">

                <i class="fa-solid fa-xmark"></i>

            </button>


        </div>


        <form id="prescriptionForm">


            <!-- MEDICINE -->

            <div class="form-group">


                <label for="medicineName">

                    Medicine Name

                </label>


                <div class="input-wrapper">


                    <i class="fa-solid fa-pills"></i>


                    <input
                            type="text"
                            id="medicineName"
                            placeholder="Enter medicine name"
                            required>


                </div>


            </div>


            <!-- DOSAGE -->

            <div class="form-group">


                <label for="dosage">

                    Dosage

                </label>


                <div class="input-wrapper">


                    <i class="fa-solid fa-capsules"></i>


                    <input
                            type="text"
                            id="dosage"
                            placeholder="Example: 500mg twice daily"
                            required>


                </div>


            </div>


            <!-- DATE -->

            <div class="form-group">


                <label for="date">

                    Date

                </label>


                <div class="input-wrapper">


                    <i class="fa-solid fa-calendar-days"></i>


                    <input
                            type="date"
                            id="date"
                            required>


                </div>


            </div>


            <!-- FOOTER -->

            <div class="modal-footer">


                <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeModal()">

                    Cancel

                </button>


                <button
                        type="submit"
                        class="save-btn"
                        id="saveButton">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Prescription

                </button>


            </div>


        </form>


    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>


    /* =====================================================
       CURRENT ROLE
       ===================================================== */

    const currentRole =
        '[[${session.role}]]';


    const canManagePrescriptions =
        currentRole === "ADMIN" ||
        currentRole === "PHARMACIST";


    let editingId = null;


    /* =====================================================
       LOAD PRESCRIPTIONS
       ===================================================== */

    async function loadPrescriptions() {


        const tbody =
            document.getElementById(
                "prescriptionTableBody"
            );


        try {


            const response =
                await fetch(
                    "/api/prescriptions"
                );


            if (!response.ok) {


                throw new Error(
                    "Failed to load prescriptions"
                );


            }


            const prescriptions =
                await response.json();


            displayPrescriptions(
                prescriptions
            );


        }


        catch (error) {


            console.error(error);


            tbody.innerHTML = `

                <tr>

                    <td colspan="5"
                        class="empty-row">

                        <i class="fa-solid fa-circle-exclamation"></i>

                        Failed to load prescriptions.

                    </td>

                </tr>

            `;


        }


    }


    /* =====================================================
       DISPLAY
       ===================================================== */

    function displayPrescriptions(
        prescriptions
    ) {


        const tbody =
            document.getElementById(
                "prescriptionTableBody"
            );


        const count =
            document.getElementById(
                "prescriptionCount"
            );


        count.textContent =
            prescriptions.length +
            (
                prescriptions.length === 1
                    ? " Prescription"
                    : " Prescriptions"
            );


        tbody.innerHTML = "";


        if (
            prescriptions.length === 0
        ) {


            tbody.innerHTML = `

                <tr>

                    <td colspan="5"
                        class="empty-row">

                        <i class="fa-solid fa-file-circle-xmark"></i>

                        No prescriptions found.

                    </td>

                </tr>

            `;


            return;


        }


        prescriptions.forEach(
            prescription => {


                const row =
                    document.createElement(
                        "tr"
                    );


                const actionHtml =
                    canManagePrescriptions

                        ? `

                            <div class="action-buttons">

                                <button
                                    class="edit-btn"
                                    onclick="editPrescription(${prescription.id})">

                                    <i class="fa-solid fa-pen"></i>

                                    Edit

                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deletePrescription(${prescription.id})">

                                    <i class="fa-solid fa-trash"></i>

                                    Delete

                                </button>

                            </div>

                          `

                        : `

                            <span class="view-only">

                                <i class="fa-solid fa-eye"></i>

                                View Only

                            </span>

                          `;


                row.innerHTML = `

                    <td class="id-text">

                        ${prescription.id}

                    </td>


                    <td class="medicine-name">

                        <i class="fa-solid fa-pills"></i>

                        ${escapeHtml(
                    prescription.medicineName
                )}

                    </td>


                    <td>

                        <span class="dosage-badge">

                            ${escapeHtml(
                    prescription.dosage
                )}

                        </span>

                    </td>


                    <td class="date-badge">

                        ${escapeHtml(
                    prescription.date
                )}

                    </td>


                    <td>

                        ${actionHtml}

                    </td>

                `;


                tbody.appendChild(
                    row
                );


            }
        );


    }


    /* =====================================================
       OPEN ADD MODAL
       ===================================================== */

    function openAddModal() {


        if (!canManagePrescriptions) {


            showMessage(
                "You do not have permission to add prescriptions.",
                "error"
            );


            return;


        }


        editingId = null;


        document
            .getElementById(
                "prescriptionForm"
            )
            .reset();


        document
            .getElementById(
                "modalTitle"
            )
            .textContent =
            "Add Prescription";


        document
            .getElementById(
                "saveButton"
            )
            .innerHTML = `

                <i class="fa-solid fa-floppy-disk"></i>

                Save Prescription

            `;


        clearMessage();


        document
            .getElementById(
                "prescriptionModal"
            )
            .classList.add(
            "show"
        );


    }


    /* =====================================================
       CLOSE MODAL
       ===================================================== */

    function closeModal() {


        document
            .getElementById(
                "prescriptionModal"
            )
            .classList.remove(
            "show"
        );


        editingId = null;


        document
            .getElementById(
                "prescriptionForm"
            )
            .reset();


        clearMessage();


    }


    /* =====================================================
       CREATE / UPDATE
       ===================================================== */

    document
        .getElementById(
            "prescriptionForm"
        )
        .addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                if (!canManagePrescriptions) {


                    showMessage(
                        "You do not have permission to manage prescriptions.",
                        "error"
                    );


                    return;


                }


                const medicineName =
                    document
                        .getElementById(
                            "medicineName"
                        )
                        .value
                        .trim();


                const dosage =
                    document
                        .getElementById(
                            "dosage"
                        )
                        .value
                        .trim();


                const date =
                    document
                        .getElementById(
                            "date"
                        )
                        .value;


                /* =========================
                   VALIDATION
                   ========================= */

                if (!medicineName) {


                    showMessage(
                        "Medicine name is required.",
                        "error"
                    );


                    return;


                }


                if (!dosage) {


                    showMessage(
                        "Dosage is required.",
                        "error"
                    );


                    return;


                }


                if (!date) {


                    showMessage(
                        "Date is required.",
                        "error"
                    );


                    return;


                }


                const prescription = {


                    medicineName:
                    medicineName,


                    dosage:
                    dosage,


                    date:
                    date


                };


                try {


                    let response;


                    const wasEditing =
                        editingId !== null;


                    /* =========================
                       CREATE
                       ========================= */

                    if (!wasEditing) {


                        response =
                            await fetch(
                                "/api/prescriptions",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify(
                                            prescription
                                        )

                                }
                            );


                    }


                    /* =========================
                       UPDATE
                       ========================= */

                    else {


                        response =
                            await fetch(
                                `/api/prescriptions/${editingId}`,
                                {

                                    method: "PUT",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify(
                                            prescription
                                        )

                                }
                            );


                    }


                    if (!response.ok) {


                        throw new Error(
                            "Operation failed"
                        );


                    }


                    showMessage(

                        wasEditing
                            ? "Prescription updated successfully!"
                            : "Prescription added successfully!",

                        "success"

                    );


                    await loadPrescriptions();


                    setTimeout(
                        () => {

                            closeModal();

                        },
                        700
                    );


                }


                catch (error) {


                    console.error(
                        error
                    );


                    showMessage(
                        "Something went wrong. Please try again.",
                        "error"
                    );


                }


            }
        );


    /* =====================================================
       EDIT
       ===================================================== */

    async function editPrescription(
        id
    ) {


        if (!canManagePrescriptions) {


            showMessage(
                "You do not have permission to edit prescriptions.",
                "error"
            );


            return;


        }


        try {


            const response =
                await fetch(
                    `/api/prescriptions/${id}`
                );


            if (!response.ok) {


                throw new Error(
                    "Prescription not found"
                );


            }


            const prescription =
                await response.json();


            editingId = id;


            document
                .getElementById(
                    "medicineName"
                )
                .value =
                prescription.medicineName
                || "";


            document
                .getElementById(
                    "dosage"
                )
                .value =
                prescription.dosage
                || "";


            document
                .getElementById(
                    "date"
                )
                .value =
                prescription.date
                || "";


            document
                .getElementById(
                    "modalTitle"
                )
                .textContent =
                "Edit Prescription";


            document
                .getElementById(
                    "saveButton"
                )
                .innerHTML = `

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Prescription

                `;


            clearMessage();


            document
                .getElementById(
                    "prescriptionModal"
                )
                .classList.add(
                "show"
            );


        }


        catch (error) {


            console.error(
                error
            );


            showMessage(
                "Unable to load prescription.",
                "error"
            );


        }


    }


    /* =====================================================
       DELETE
       ===================================================== */

    async function deletePrescription(
        id
    ) {


        if (!canManagePrescriptions) {


            showMessage(
                "You do not have permission to delete prescriptions.",
                "error"
            );


            return;


        }


        const confirmed =
            confirm(
                "Are you sure you want to delete this prescription?"
            );


        if (!confirmed) {


            return;


        }


        try {


            const response =
                await fetch(
                    `/api/prescriptions/${id}`,
                    {

                        method: "DELETE"

                    }
                );


            if (!response.ok) {


                throw new Error(
                    "Delete failed"
                );


            }


            showMessage(
                "Prescription deleted successfully.",
                "success"
            );


            await loadPrescriptions();


        }


        catch (error) {


            console.error(
                error
            );


            showMessage(
                "Failed to delete prescription.",
                "error"
            );


        }


    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(
        text,
        type
    ) {


        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            text;


        message.className =
            "message " + type;


    }


    function clearMessage() {


        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            "";


        message.className =
            "message";


    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(
        value
    ) {


        if (
            value === null ||
            value === undefined
        ) {


            return "";


        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );


    }


    /* =====================================================
       CLOSE MODAL OUTSIDE CLICK
       ===================================================== */

    document
        .getElementById(
            "prescriptionModal"
        )
        .addEventListener(
            "click",
            function(event) {


                if (
                    event.target === this
                ) {


                    closeModal();


                }


            }
        );


    /* =====================================================
       ESC KEY
       ===================================================== */

    document.addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Escape"
            ) {


                closeModal();


            }


        }
    );


    /* =====================================================
       INITIAL LOAD
       ===================================================== */

    loadPrescriptions();


</script>


</body>

</html>
