
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

</head>

<body>

<header class="top-navbar"
        th:fragment="navbar">


    <!-- =====================================================
         NOTIFICATION STYLES
         ===================================================== -->

    <style>


        /* =====================================================
           NAVBAR LAYOUT FIX
           Keep title on left and all controls on right
           ===================================================== */

        .top-navbar {
            width: 100% !important;
            min-height: 72px !important;
            padding: 0 24px !important;
            box-sizing: border-box !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 0 !important;
            position: relative !important;
        }

        .top-navbar .navbar-title {
            order: 1 !important;
            flex: 0 0 auto !important;
            white-space: nowrap !important;
            margin: 0 !important;
        }

        .top-navbar .navbar-menu {
            order: 2 !important;
            flex: 0 0 auto !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 6px !important;
            margin-left: auto !important;
            margin-right: 16px !important;
        }

        .top-navbar .navbar-menu a {
            flex: 0 0 auto !important;
            white-space: nowrap !important;
        }

        .top-navbar .navbar-actions {
            order: 3 !important;
            flex: 0 0 auto !important;
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: flex-end !important;
            gap: 14px !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .top-navbar .notification-wrapper {
            order: 1 !important;
            flex: 0 0 auto !important;
            position: relative !important;
            left: auto !important;
            right: auto !important;
            top: auto !important;
            bottom: auto !important;
            margin: 0 !important;
        }

        .top-navbar .logout-button {
            order: 2 !important;
            flex: 0 0 auto !important;
            width: auto !important;
            min-width: 0 !important;
            white-space: nowrap !important;
            margin: 0 !important;
        }

        @media (max-width: 900px) {
            .top-navbar {
                padding: 0 14px !important;
            }

            .top-navbar .navbar-menu {
                gap: 2px !important;
                margin-right: 8px !important;
            }

            .top-navbar .navbar-actions {
                gap: 8px !important;
            }
        }


        /* Never allow the supplier notification to escape the navbar. */
        .top-navbar .navbar-actions,
        .top-navbar .navbar-actions * {
            box-sizing: border-box;
        }

        .top-navbar .navbar-actions .notification-wrapper {
            float: none !important;
            transform: none !important;
        }

        /* =====================================================
           NOTIFICATION WRAPPER
           ===================================================== */

        .notification-wrapper {

            position: relative;

            display: flex;

            align-items: center;

        }


        /* =====================================================
           BELL BUTTON
           ===================================================== */

        .notification-button {

            position: relative;

            width: 44px;

            height: 44px;

            border: none;

            background: #f8fafc;

            color: #475569;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            font-size: 17px;

            transition: 0.2s;

        }


        .notification-button:hover {

            background: #eff6ff;

            color: #2563eb;

        }


        .notification-button.has-alerts {

            color: #2563eb;

            background: #eff6ff;

        }


        /* =====================================================
           RED BADGE
           ===================================================== */

        .notification-badge {

            position: absolute;

            top: 0;

            right: 0;

            min-width: 18px;

            height: 18px;

            padding: 0 5px;

            background: #ef4444;

            color: white;

            border-radius: 50%;

            border: 2px solid white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 9px;

            font-weight: 800;

        }


        /* =====================================================
           DROPDOWN
           ===================================================== */

        .notification-dropdown {

            position: absolute;

            top: calc(100% + 10px);

            right: 0;

            width: 350px;

            background: white;

            border-radius: 14px;

            border: 1px solid #e5e7eb;

            box-shadow:
                    0 15px 40px
                    rgba(15, 23, 42, 0.15);

            overflow: hidden;

            z-index: 9999;

            display: none;

        }


        .notification-dropdown.show {

            display: block;

        }


        /* =====================================================
           HEADER
           ===================================================== */

        .notification-header {

            height: 58px;

            padding: 0 17px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom: 1px solid #e5e7eb;

        }


        .notification-header h3 {

            margin: 0;

            color: #0f172a;

            font-size: 15px;

            font-weight: 800;

        }


        .notification-header-count {

            color: #2563eb;

            font-size: 11px;

            font-weight: 700;

        }


        /* =====================================================
           NOTIFICATION LIST
           ===================================================== */

        .notification-list {

            max-height: 360px;

            overflow-y: auto;

        }


        /* =====================================================
           LOW STOCK ITEM
           ===================================================== */

        .notification-item {

            padding: 14px;

            border-bottom: 1px solid #edf2f7;

        }


        .notification-low-stock {

            background: #fff7f7;

            border: 1px solid #fee2e2;

            border-radius: 11px;

            padding: 13px;

        }


        .notification-row {

            display: flex;

            gap: 11px;

            align-items: flex-start;

        }


        /* =====================================================
           ALERT ICON
           ===================================================== */

        .notification-alert-icon {

            width: 35px;

            height: 35px;

            min-width: 35px;

            border-radius: 9px;

            background: #fee2e2;

            color: #ef4444;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

        }


        /* =====================================================
           CONTENT
           ===================================================== */

        .notification-content {

            flex: 1;

            min-width: 0;

        }


        .notification-title {

            margin: 0 0 5px;

            color: #ef4444;

            font-size: 12px;

            font-weight: 800;

        }


        .notification-medicine {

            margin: 0 0 5px;

            color: #163f7a;

            font-size: 13px;

            font-weight: 800;

        }


        .notification-quantity {

            margin: 0;

            color: #64748b;

            font-size: 11px;

            line-height: 1.6;

        }


        .notification-quantity strong {

            color: #334155;

        }


        /* =====================================================
           VIEW STOCK BUTTON
           ===================================================== */

        .notification-view-stock {

            margin-top: 9px;

            border: none;

            background: #eff6ff;

            color: #2563eb;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

        }


        .notification-view-stock:hover {

            background: #dbeafe;

        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .notification-empty {

            padding: 38px 20px;

            text-align: center;

        }


        .notification-empty-icon {

            width: 58px;

            height: 58px;

            margin: 0 auto 13px;

            border-radius: 50%;

            background: #eff6ff;

            color: #9ab8e8;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

        }


        .notification-empty h4 {

            margin: 0 0 7px;

            color: #0f172a;

            font-size: 15px;

            font-weight: 800;

        }


        .notification-empty p {

            margin: 0;

            color: #64748b;

            font-size: 11px;

            line-height: 1.6;

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .notification-footer {

            height: 52px;

            padding: 0 16px;

            display: flex;

            align-items: center;

            color: #2563eb;

            font-size: 11px;

            font-weight: 700;

            border-top: 1px solid #e5e7eb;

            cursor: pointer;

        }


        .notification-footer:hover {

            background: #f8fafc;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .notification-dropdown {

                position: fixed;

                top: 70px;

                right: 12px;

                left: 12px;

                width: auto;

            }

        }

    </style>


    <!-- =====================================================
         SYSTEM TITLE
         ===================================================== -->

    <div class="navbar-title">

        <i class="fa-solid fa-prescription-bottle-medical"></i>

        Pharmacy Management System

    </div>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <nav class="navbar-menu">


        <!-- DASHBOARD -->

        <a href="/dashboard"
           th:if="${session.role != null}"
           data-path="/dashboard">

            <i class="fa-solid fa-chart-line"></i>

            Dashboard

        </a>


        <!-- USERS -->

        <a href="/users"
           th:if="${session.role == 'ADMIN'}"
           data-path="/users">

            <i class="fa-solid fa-users"></i>

            Users &amp; Stakeholders

        </a>


        <!-- MEDICINES -->

        <a href="/medicines"
           th:if="${session.role == 'ADMIN'
               or session.role == 'PHARMACIST'
               or session.role == 'INVENTORY_OFFICER'
               or session.role == 'SALES_OFFICER'}"
           data-path="/medicines">

            <i class="fa-solid fa-pills"></i>

            Medicines

        </a>


        <!-- SUPPLIERS -->

        <a href="/suppliers"
           th:if="${session.role == 'ADMIN'
               or session.role == 'INVENTORY_OFFICER'
               or session.role == 'SUPPLIER'}"
           data-path="/suppliers">

            <i class="fa-solid fa-truck-medical"></i>

            Suppliers

        </a>


        <!-- STOCK -->

        <a href="/stock"
           th:if="${session.role == 'ADMIN'
               or session.role == 'PHARMACIST'
               or session.role == 'INVENTORY_OFFICER'
               or session.role == 'SALES_OFFICER'
               or session.role == 'SUPPLIER'}"
           data-path="/stock">

            <i class="fa-solid fa-boxes-stacked"></i>

            Stock

        </a>


        <!-- PRESCRIPTIONS -->

        <a href="/prescriptions"
           th:if="${session.role == 'ADMIN'
               or session.role == 'PHARMACIST'
               or session.role == 'INVENTORY_OFFICER'}"
           data-path="/prescriptions">

            <i class="fa-solid fa-file-prescription"></i>

            Prescriptions

        </a>


        <!-- SALES -->

        <a href="/sales"
           th:if="${session.role == 'ADMIN'
               or session.role == 'PHARMACIST'
               or session.role == 'FINANCE_OFFICER'
               or session.role == 'SALES_OFFICER'}"
           data-path="/sales">

            <i class="fa-solid fa-cart-shopping"></i>

            Sales

        </a>


        <!-- INVOICES -->

        <a href="/invoices"
           th:if="${session.role == 'ADMIN'
               or session.role == 'PHARMACIST'
               or session.role == 'FINANCE_OFFICER'
               or session.role == 'SALES_OFFICER'}"
           data-path="/invoices">

            <i class="fa-solid fa-file-invoice"></i>

            Invoices

        </a>

    </nav>


    <!-- =====================================================
         RIGHT SIDE ACTIONS
         ===================================================== -->

    <div class="navbar-actions">

        <!-- =====================================================
             NOTIFICATION BELL
             SUPPLIER ONLY
             ===================================================== -->

        <div class="notification-wrapper"
             th:if="${session.role == 'SUPPLIER'}">


            <button
                    type="button"
                    id="notificationButton"
                    class="notification-button"
                    onclick="toggleNotifications()"
                    aria-label="Notifications">

                <i class="fa-solid fa-bell"></i>


                <span
                        id="notificationBadge"
                        class="notification-badge"
                        style="display: none;">

                0

            </span>

            </button>


            <!-- =================================================
                 DROPDOWN
                 ================================================= -->

            <div
                    id="notificationDropdown"
                    class="notification-dropdown">


                <!-- HEADER -->

                <div class="notification-header">

                    <h3>
                        Notifications
                    </h3>


                    <span
                            id="notificationHeaderCount"
                            class="notification-header-count">

                    0 alerts

                </span>

                </div>


                <!-- LIST -->

                <div
                        id="notificationList"
                        class="notification-list">

                    <div class="notification-empty">

                        <div class="notification-empty-icon">

                            <i class="fa-regular fa-bell"></i>

                        </div>

                        <h4>
                            No stock alerts
                        </h4>

                        <p>
                            All medicines are above
                            minimum stock levels.
                        </p>

                    </div>

                </div>


                <!-- FOOTER -->

                <div
                        class="notification-footer"
                        onclick="goToStock()">

                    View Stock

                </div>

            </div>

        </div>



        <!-- =====================================================
             LOGOUT
             ===================================================== -->

        <a href="/logout"
           class="logout-button">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </a>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>


        /* =====================================================
           ACTIVE NAVIGATION
           ===================================================== */

        function setActiveNavigation() {

            const currentPath =
                window.location.pathname;


            const navLinks =
                document.querySelectorAll(
                    ".navbar-menu a[data-path]"
                );


            navLinks.forEach(
                function (link) {

                    const linkPath =
                        link.getAttribute(
                            "data-path"
                        );


                    if (
                        currentPath === linkPath
                    ) {

                        link.classList.add(
                            "active"
                        );

                    }

                }
            );

        }


        /* =====================================================
           OPEN / CLOSE
           ===================================================== */

        function toggleNotifications() {

            const dropdown =
                document.getElementById(
                    "notificationDropdown"
                );


            if (!dropdown) {

                return;

            }


            dropdown.classList.toggle(
                "show"
            );


            if (
                dropdown.classList.contains(
                    "show"
                )
            ) {

                loadNotifications();

            }

        }


        /* =====================================================
           CLOSE WHEN CLICKING OUTSIDE
           ===================================================== */

        document.addEventListener(
            "click",
            function (event) {

                const wrapper =
                    document.querySelector(
                        ".notification-wrapper"
                    );


                const dropdown =
                    document.getElementById(
                        "notificationDropdown"
                    );


                if (
                    !wrapper ||
                    !dropdown
                ) {

                    return;

                }


                if (
                    !wrapper.contains(
                        event.target
                    )
                ) {

                    dropdown.classList.remove(
                        "show"
                    );

                }

            }
        );


        /* =====================================================
           GET NOTIFICATION COUNT
           ===================================================== */

        async function loadNotificationCount() {

            const badge =
                document.getElementById(
                    "notificationBadge"
                );


            const button =
                document.getElementById(
                    "notificationButton"
                );


            const headerCount =
                document.getElementById(
                    "notificationHeaderCount"
                );


            if (
                !badge ||
                !button
            ) {

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/notifications/count",
                        {
                            method: "GET",

                            credentials:
                                "same-origin",

                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    return;

                }


                const count =
                    await response.json();


                /* =============================================
                   LOW STOCK EXISTS
                   ============================================= */

                if (count > 0) {

                    badge.textContent =
                        count > 99
                            ? "99+"
                            : count;


                    badge.style.display =
                        "flex";


                    button.classList.add(
                        "has-alerts"
                    );


                    if (headerCount) {

                        headerCount.textContent =
                            count === 1
                                ? "1 alert"
                                : count + " alerts";

                    }

                }


                /* =============================================
                   NO LOW STOCK
                   ============================================= */

                else {

                    badge.style.display =
                        "none";


                    button.classList.remove(
                        "has-alerts"
                    );


                    if (headerCount) {

                        headerCount.textContent =
                            "0 alerts";

                    }

                }

            }

            catch (error) {

                console.error(
                    "Notification count error:",
                    error
                );

            }

        }


        /* =====================================================
           GET NOTIFICATIONS
           ===================================================== */

        async function loadNotifications() {

            const list =
                document.getElementById(
                    "notificationList"
                );


            if (!list) {

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/notifications",
                        {
                            method: "GET",

                            credentials:
                                "same-origin",

                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load notifications"
                    );

                }


                const notifications =
                    await response.json();


                renderNotifications(
                    notifications
                );


                /*
                 * Update badge immediately
                 * after loading the current data.
                 */

                loadNotificationCount();

            }

            catch (error) {

                console.error(
                    "Notification loading error:",
                    error
                );


                renderNotifications([]);

            }

        }


        /* =====================================================
           RENDER
           ===================================================== */

        function renderNotifications(
            notifications
        ) {

            const list =
                document.getElementById(
                    "notificationList"
                );


            if (!list) {

                return;

            }


            /* =================================================
               NO LOW STOCK
               ================================================= */

            if (
                !notifications ||
                notifications.length === 0
            ) {

                list.innerHTML = `

                    <div class="notification-empty">

                        <div class="notification-empty-icon">

                            <i class="fa-regular fa-bell"></i>

                        </div>


                        <h4>
                            No stock alerts
                        </h4>


                        <p>
                            All medicines are above
                            minimum stock levels.
                        </p>

                    </div>

                `;


                return;

            }


            /* =================================================
               LOW STOCK NOTIFICATIONS
               ================================================= */

            list.innerHTML = "";


            notifications.forEach(
                function (notification) {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "notification-item";


                    const medicineName =
                        escapeHtml(
                            notification.medicineName
                        );


                    const currentQuantity =
                        notification.currentQuantity;


                    const minimumQuantity =
                        notification.minimumQuantity;


                    item.innerHTML = `

                        <div class="notification-low-stock">

                            <div class="notification-row">


                                <!-- ICON -->

                                <div class="notification-alert-icon">

                                    <i class="fa-solid fa-triangle-exclamation"></i>

                                </div>


                                <!-- CONTENT -->

                                <div class="notification-content">


                                    <p class="notification-title">

                                        Low Stock Alert

                                    </p>


                                    <p class="notification-medicine">

                                        ${medicineName}

                                    </p>


                                    <p class="notification-quantity">

                                        Current:

                                        <strong>
                                            ${currentQuantity}
                                        </strong>

                                        &nbsp; | &nbsp;

                                        Minimum:

                                        <strong>
                                            ${minimumQuantity}
                                        </strong>

                                    </p>


                                    <button
                                            type="button"
                                            class="notification-view-stock"
                                            onclick="goToStock()">

                                        View Stock

                                    </button>


                                </div>

                            </div>

                        </div>

                    `;


                    list.appendChild(
                        item
                    );

                }
            );

        }


        /* =====================================================
           GO TO STOCK
           ===================================================== */

        function goToStock() {

            window.location.href =
                "/stock";

        }


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           REFRESH
           ===================================================== */

        function refreshNotifications() {

            loadNotificationCount();


            const dropdown =
                document.getElementById(
                    "notificationDropdown"
                );


            if (
                dropdown &&
                dropdown.classList.contains(
                    "show"
                )
            ) {

                loadNotifications();

            }

        }


        /* =====================================================
           INITIALIZE
           ===================================================== */

        function initializeNavbar() {

            setActiveNavigation();

            loadNotificationCount();


            /*
             * Check every 10 seconds.
             *
             * Therefore if stock changes from:
             *
             * 10 / 100
             *
             * to:
             *
             * 400 / 100
             *
             * the red notification disappears
             * automatically.
             */

            setInterval(
                refreshNotifications,
                10000
            );

        }


        /* =====================================================
           PAGE FOCUS
           ===================================================== */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    refreshNotifications();

                }

            }
        );


        window.addEventListener(
            "focus",
            function () {

                refreshNotifications();

            }
        );


        /* =====================================================
           START
           ===================================================== */

        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeNavbar
            );

        }

        else {

            initializeNavbar();

        }

    </script>

</header>

</body>

</html>
